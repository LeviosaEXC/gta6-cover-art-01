<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Collage — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">NEON COAST <span>COLLAGE</span></div>
  <div class="brand-sub">Free-form snapshot studio — tilt it, tape it, pin it, post it</div>
</header>
<main class="app">
  <aside class="controls">
    <section>
      <h2>Photos</h2>
      <label class="file-btn">Add photos <input id="photoInput" type="file" accept="image/*" multiple></label>
      <div id="photoSlots" class="slots" aria-label="Loaded photos"></div>
      <button id="fillAll" type="button">Use selected photo on selected card</button>
      <p class="hint">Drag a card to move it. Scroll on a card to zoom its photo. Rotate the selected card below.</p>
    </section>
    <section>
      <h2>Arrangement</h2>
      <div id="layoutBar" class="picker"></div>
      <div class="sizes"><button id="rotateBtn" type="button">Rotate selected card +15°</button></div>
    </section>
    <section>
      <h2>Coast grade</h2>
      <div id="gradeBar" class="picker"></div>
    </section>
    <section>
      <h2>Lettering</h2>
      <label>Title <input id="titleInput" type="text" maxlength="24" value="SUNSET HEIST"></label>
      <label>Subtitle <input id="subtitleInput" type="text" maxlength="40" value="vice city nights"></label>
      <label>Sticker <input id="badgeInput" type="text" maxlength="16" value="VICE CITY"></label>
    </section>
    <section>
      <h2>Export</h2>
      <div class="sizes">
        <button id="sizeSquare" type="button">1080 × 1080</button>
        <button id="sizePortrait" type="button">1080 × 1350</button>
        <button id="sizeLandscape" type="button">1920 × 1080</button>
      </div>
      <div class="sizes">
        <button id="exportSquare" type="button">Export square PNG</button>
        <button id="exportPortrait" type="button">Export portrait PNG</button>
        <button id="exportLandscape" type="button">Export landscape PNG</button>
      </div>
      <div class="sizes">
        <button id="undoBtn" type="button">Undo</button>
        <button id="redoBtn" type="button">Redo</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </aside>
  <section class="stage-wrap">
    <canvas id="stage" width="960" height="540" aria-label="Cover preview"></canvas>
    <p class="stage-hint">Live preview — drag cards to compose your collage.</p>
  </section>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
